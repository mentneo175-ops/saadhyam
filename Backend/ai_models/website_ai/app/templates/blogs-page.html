<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - {{ business_name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background: #f8f9fa;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        
        .header p {
            font-size: 20px;
            opacity: 0.95;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 40px;
        }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .blog-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .blog-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        .blog-card-image {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
            font-weight: 700;
        }
        
        .blog-card-content {
            padding: 30px;
        }
        
        .blog-card-category {
            display: inline-block;
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        
        .blog-card-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #2c3e50;
            line-height: 1.3;
        }
        
        .blog-card-excerpt {
            font-size: 16px;
            color: #6c757d;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .blog-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #86868b;
        }
        
        .blog-loading {
            text-align: center;
            color: #6c757d;
            font-size: 18px;
            padding: 40px;
        }
        
        .blog-empty {
            text-align: center;
            color: #6c757d;
            font-size: 18px;
            padding: 40px;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 40px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }
            
            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Our Blog</h1>
        <p>Insights, tips, and updates from {{ business_name }}</p>
    </header>
    
    <div class="container">
        <a href="index.html" class="back-link">← Back to Home</a>
        
        <div class="blog-grid" id="blog-posts-container">
            <p class="blog-loading">Loading blog posts...</p>
        </div>
    </div>
    
    <script>
        async function loadAllBlogs() {
            const container = document.getElementById('blog-posts-container');
            
            try {
                const response = await fetch('blogs.json');
                
                if (!response.ok) {
                    throw new Error('No blogs found');
                }
                
                const data = await response.json();
                const blogs = data.blogs || [];
                
                if (blogs.length === 0) {
                    container.innerHTML = '<p class="blog-empty">No blog posts yet. Check back soon!</p>';
                    return;
                }
                
                container.innerHTML = blogs.map(blog => `
                    <article class="blog-card" onclick="window.location.href='blog-${blog.slug}.html'">
                        <div class="blog-card-image">
                            ${blog.title.charAt(0)}
                        </div>
                        <div class="blog-card-content">
                            <span class="blog-card-category">${blog.category || 'Blog'}</span>
                            <h3 class="blog-card-title">${blog.title}</h3>
                            <p class="blog-card-excerpt">${blog.meta_description || blog.introduction.substring(0, 150) + '...'}</p>
                            <div class="blog-card-meta">
                                <span>📅 ${new Date(blog.published_at).toLocaleDateString()}</span>
                                <span>⏱️ ${blog.reading_time || 5} min read</span>
                            </div>
                        </div>
                    </article>
                `).join('');
                
            } catch (error) {
                console.error('Error loading blogs:', error);
                container.innerHTML = '<p class="blog-empty">No blog posts yet. Check back soon!</p>';
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadAllBlogs);
        } else {
            loadAllBlogs();
        }
    </script>
</body>
</html>
