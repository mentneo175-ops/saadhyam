<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - {{ business_name }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-color: #faf9f6;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-color: #4f46e5;
            --border-color: rgba(226, 232, 240, 0.8);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 80px;
        }
        
        .header {
            background: linear-gradient(135deg, #0e1227 0%, #03040c 100%);
            color: white;
            padding: 100px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }
        
        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -0.02em;
        }
        
        .header p {
            font-size: clamp(16px, 2vw, 20px);
            opacity: 0.8;
            font-weight: 300;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: var(--transition);
        }
        
        .back-link:hover {
            transform: translateX(-4px);
        }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }
        
        .blog-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .blog-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            border-color: rgba(79, 70, 229, 0.2);
        }
        
        .blog-card-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 54px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
        }
        
        .blog-card-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        
        .blog-card-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(79, 70, 229, 0.08);
            color: var(--accent-color);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 16px;
            width: fit-content;
        }
        
        .blog-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-dark);
            line-height: 1.3;
        }
        
        .blog-card-excerpt {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 300;
        }
        
        .blog-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            padding-top: 16px;
            margin-top: auto;
        }
        
        .blog-loading, .blog-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 16px;
            padding: 60px;
            grid-column: 1 / -1;
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 80px 24px;
            }
            
            .container {
                padding: 40px 24px;
            }
            
            .blog-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Insights &amp; Articles</h1>
        <p>Updates, tips, and thoughts from {{ business_name }}</p>
    </header>
    
    <div class="container">
        <a href="index.html" class="back-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Home
        </a>
        
        <div class="blog-grid" id="blog-posts-container">
            <p class="blog-loading">Loading blog posts...</p>
        </div>
    </div>
    
    <script>
        async function loadAllBlogs() {
            const container = document.getElementById('blog-posts-container');
            
            try {
                const response = await fetch('blogs.json');
                
                if (!response.ok) {
                    throw new Error('No blogs found');
                }
                
                const data = await response.json();
                const blogs = data.blogs || [];
                
                if (blogs.length === 0) {
                    container.innerHTML = '<p class="blog-empty">No blog posts yet. Check back soon!</p>';
                    return;
                }
                
                container.innerHTML = blogs.map(blog => `
                    <article class="blog-card" onclick="window.location.href='blog-${blog.slug}.html'">
                        <div class="blog-card-image">
                            ${blog.title.charAt(0)}
                        </div>
                        <div class="blog-card-content">
                            <div>
                                <span class="blog-card-category">${blog.category || 'Blog'}</span>
                                <h3 class="blog-card-title">${blog.title}</h3>
                                <p class="blog-card-excerpt">${blog.meta_description || blog.introduction.substring(0, 120) + '...'}</p>
                            </div>
                            <div class="blog-card-meta">
                                <span>📅 ${new Date(blog.published_at).toLocaleDateString()}</span>
                                <span>⏱️ ${blog.reading_time || 5} min read</span>
                            </div>
                        </div>
                    </article>
                `).join('');
                
            } catch (error) {
                console.error('Error loading blogs:', error);
                container.innerHTML = '<p class="blog-empty">No blog posts yet. Check back soon!</p>';
            }
        }
        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadAllBlogs);
        } else {
            loadAllBlogs();
        }
    </script>
</body>
</html>
