<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Connection Failed</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
            font-weight: 600;
        }
        p {
            margin: 0 0 1.5rem 0;
            opacity: 0.9;
        }
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            margin-right: 0.5rem;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        .retry-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #ee5a24;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .retry-btn:hover {
            background: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">❌</div>
        <h1>Instagram Connection Failed</h1>
        <p>There was an issue connecting your Instagram account.</p>
        <p>Please try again or check your Instagram Business account setup.</p>
        <button class="close-btn" onclick="closeWindow()">Close Window</button>
        <button class="retry-btn" onclick="retryConnection()">Try Again</button>
    </div>

    <script>
        // Get error message from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const errorMessage = urlParams.get('message') || 'Unknown error occurred';

        // Notify parent window of error
        if (window.opener) {
            window.opener.postMessage({
                type: 'INSTAGRAM_OAUTH_ERROR',
                message: errorMessage
            }, '*');
        }

        function closeWindow() {
            if (window.opener) {
                window.close();
            } else {
                // If not opened as popup, redirect to dashboard
                window.location.href = '/dashboard/settings';
            }
        }

        function retryConnection() {
            if (window.opener) {
                // Tell parent to retry
                window.opener.postMessage({
                    type: 'INSTAGRAM_OAUTH_RETRY'
                }, '*');
                window.close();
            } else {
                window.location.href = '/dashboard/settings';
            }
        }
    </script>
</body>
</html>
