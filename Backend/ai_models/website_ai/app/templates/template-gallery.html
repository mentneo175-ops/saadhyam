<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Gallery - Choose Your Design</title>
    <link rel="stylesheet" href="/website-ai/static/theme-adapter.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }

        .header h1 {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 16px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 20px;
            opacity: 0.95;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }

        .template-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.4s;
            cursor: pointer;
        }

        .template-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .template-preview {
            height: 320px;
            position: relative;
            overflow: hidden;
            background: #f5f5f5;
        }

        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none;
            transform: scale(0.5);
            transform-origin: top left;
            width: 200%;
            height: 200%;
        }

        .template-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.7) 100%);
            display: flex;
            align-items: flex-end;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .template-card:hover .template-overlay {
            opacity: 1;
        }

        .overlay-btn {
            background: white;
            color: #1e3c72;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .overlay-btn:hover {
            background: #1e3c72;
            color: white;
        }

        .template-info {
            padding: 32px;
        }

        .template-badge {
            display: inline-block;
            padding: 6px 16px;
            background: #e3f2fd;
            color: #1e3c72;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .template-info h3 {
            font-size: 28px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .template-info p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .template-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .feature-tag {
            padding: 6px 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }

        .template-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #1a1a1a;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
        }

        .back-link a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 32px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            display: inline-block;
            transition: all 0.3s;
        }

        .back-link a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body class="website-ai-ui">
    <div class="container">
        <div class="header">
            <h1>🎨 Choose Your Template</h1>
            <p>6 Unique Designs - Each with a Different Layout & Style</p>
        </div>

        <div class="gallery-grid" id="templateGallery">
            <!-- Templates will be loaded here -->
        </div>

        <div class="back-link">
            <a href="/">← Back to Generator</a>
        </div>
    </div>

    <script>
        const templates = [
            {
                id: 'hero-split',
                name: 'Hero Split',
                badge: 'Full Screen',
                description: 'Full-screen split layout with immersive hero section. Perfect for SaaS products and tech startups that want to make a bold first impression.',
                features: ['Split Screen', 'Gradient Hero', 'Sticky Scroll', 'Modern Cards'],
                bestFor: 'SaaS, Tech Startups'
            },
            {
                id: 'card-masonry',
                name: 'Card Masonry',
                badge: 'Dark Theme',
                description: 'Dark theme with dynamic masonry card grid. Ideal for creative agencies and portfolios that want a sophisticated, modern look.',
                features: ['Dark Mode', 'Masonry Grid', 'Floating Header', 'Neon Accents'],
                bestFor: 'Creative Agencies, Portfolios'
            },
            {
                id: 'timeline-vertical',
                name: 'Timeline Vertical',
                badge: 'Elegant',
                description: 'Elegant timeline layout with fixed sidebar navigation. Great for storytelling, services showcase, and professional consulting.',
                features: ['Timeline Design', 'Sidebar Nav', 'Serif Typography', 'Accordion FAQ'],
                bestFor: 'Consulting, Professional Services'
            },
            {
                id: 'magazine-grid',
                name: 'Magazine Grid',
                badge: 'Bold Editorial',
                description: 'Bold magazine-style grid layout with strong typography. Perfect for media companies and content-heavy websites.',
                features: ['Editorial Grid', 'Bold Typography', 'Modular Sections', 'High Contrast'],
                bestFor: 'Media, Publishing, News'
            },
            {
                id: 'bento-box',
                name: 'Bento Box',
                badge: 'Apple Style',
                description: 'Apple-inspired bento box grid with smooth animations. Modern and clean design perfect for product showcases and tech brands.',
                features: ['Bento Grid', 'Glassmorphism', 'Smooth Animations', 'Premium Feel'],
                bestFor: 'Product Showcase, Tech Brands'
            },
            {
                id: 'parallax-scroll',
                name: 'Parallax Scroll',
                badge: 'Futuristic',
                description: 'Futuristic parallax scrolling experience with neon accents. Eye-catching design for innovative tech companies and startups.',
                features: ['Parallax Effect', 'Neon Gradients', 'Scroll Animations', 'Immersive'],
                bestFor: 'Tech Innovation, Startups'
            }
        ];

        function loadTemplates() {
            const gallery = document.getElementById('templateGallery');

            templates.forEach(template => {
                const card = document.createElement('div');
                card.className = 'template-card';
                card.innerHTML = `
          <div class="template-preview">
            <iframe
              class="preview-iframe"
              src="/website-ai/output/demo_${template.id}.html"
              loading="lazy"
            ></iframe>
            <div class="template-overlay">
              <a href="/website-ai/output/demo_${template.id}.html" target="_blank" class="overlay-btn">
                👁️ Full Preview
              </a>
            </div>
          </div>
          <div class="template-info">
            <span class="template-badge">${template.badge}</span>
            <h3>${template.name}</h3>
            <p>${template.description}</p>
            <div class="template-features">
              ${template.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
            </div>
            <div class="template-actions">
              <a href="/website-ai/output/demo_${template.id}.html" target="_blank" class="btn btn-secondary">
                Preview
              </a>
              <a href="/website-ai/?theme=${template.id}" class="btn btn-primary">
                Use This Template
              </a>
            </div>
          </div>
        `;
                gallery.appendChild(card);
            });
        }

        // Load templates when page loads
        loadTemplates();
    </script>
</body>

</html>
