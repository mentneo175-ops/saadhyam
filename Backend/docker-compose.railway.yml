version: "3.8"

# Railway-compatible Docker Compose for local testing
# This mimics Railway's single-service deployment approach

services:
  # PostgreSQL (Railway managed in production)
  postgres:
    image: postgres:15-alpine
    container_name: saadhyam_postgres_railway
    environment:
      POSTGRES_USER: saadhyam_user
      POSTGRES_PASSWORD: saadhyam_password
      POSTGRES_DB: saadhyam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_railway:/var/lib/postgresql/data
    networks:
      - saadhyam_railway_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saadhyam_user -d saadhyam_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Railway managed in production)
  redis:
    image: redis:7-alpine
    container_name: saadhyam_redis_railway
    ports:
      - "6379:6379"
    networks:
      - saadhyam_railway_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application (Single service like Railway)
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: saadhyam_app_railway
    ports:
      - "8000:8000"
    environment:
      # Core settings
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: railway-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      
      # Performance
      LOAD_TINYLLAMA_ON_STARTUP: "False"
      
      # Database
      DATABASE_URL: postgresql://saadhyam_user:saadhyam_password@postgres:5432/saadhyam_db
      
      # Redis
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      
      # CORS
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
      
      # Railway simulation
      PORT: 8000
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saadhyam_railway_network
    volumes:
      # Persist logs and uploads
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./output:/app/output
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data_railway:

networks:
  saadhyam_railway_network:
    driver: bridge